<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ea5b4b">
<title>Monikers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="stage">
  <div class="device-slot">
    <div class="device" id="device" data-tone="light">
      <div class="glass">
        <div class="status" aria-hidden="true">
          <span id="clock">9:41</span>
          <span class="icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8 .5C5.2.5 2.6 1.6.8 3.4L2 4.6a8.5 8.5 0 0 1 6-2.4zm0 3.3c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.8 6.8 0 0 0 8 3.8c-1.8 0-3.5.7-4.8 1.9l1.2 1.2c1-.9 2.2-1.4 3.6-1.4zm0 3.3c-.6 0-1.2.2-1.6.6L8 11l1.6-1.6c-.4-.4-1-.6-1.6-.6z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" opacity=".45"/></svg>
          </span>
        </div>
        <div class="island" aria-hidden="true"></div>
        <div id="app" aria-live="polite"></div>
        <div class="homebar" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <div class="caption"><b>Monikers</b> · playable concept by Jae · unofficial fan project, original card deck<br><span class="keys">During a turn: → correct · ← pass · space to pause</span></div>
</div>
<script src="js/cards.js"></script>
<script src="js/app.js"></script>
</body>
</html>
